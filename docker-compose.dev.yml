services:
  eureka-server:
    build:
      context: ./tec-eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://eureka-server:8761/eureka
    networks:
      - internal
    restart: unless-stopped

  storage-service:
    build:
      context: ./tec-storage-service
      dockerfile: Dockerfile
    container_name: storage-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://eureka-server:8761/eureka
    networks:
      - internal
    depends_on:
      - eureka-server
    restart: unless-stopped

  api-service:
    build:
      context: ./tec-api-service
      dockerfile: Dockerfile
    container_name: api-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://eureka-server:8761/eureka
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - internal
    depends_on:
      - eureka-server
      - storage-service
    restart: unless-stopped

  gateway-service:
    build:
      context: ./tec-gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    environment:
      - EUREKA_URL=${EUREKA_URL:-http://eureka-server:8761/eureka}
      - GATEWAY_RATE_LIMIT_WINDOW=${GATEWAY_RATE_LIMIT_WINDOW:-10000}
      - GATEWAY_RATE_LIMIT_MAX_REQUESTS=${GATEWAY_RATE_LIMIT_MAX_REQUESTS:-20}
    networks:
      - internal
      - edge
    depends_on:
      - eureka-server
      - api-service
    ports:
      - "8080:8080"
    restart: unless-stopped

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true