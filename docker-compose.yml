services:
  eureka-server:
    image: ghcr.io/milozap/tec-eureka-server:latest
    container_name: eureka-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://eureka-server:8761/eureka
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  storage-service:
    image: ghcr.io/milozap/tec-storage-service:latest
    container_name: storage-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://eureka-server:8761/eureka
    networks:
      - internal
    depends_on:
      - eureka-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  api-service:
    image: ghcr.io/milozap/tec-api-service:latest
    container_name: api-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://eureka-server:8761/eureka
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - internal
    depends_on:
      - eureka-server
      - storage-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  gateway-service:
    image: ghcr.io/milozap/tec-gateway-service:latest
    container_name: gateway-service
    environment:
      - EUREKA_URL=${EUREKA_URL:-http://eureka-server:8761/eureka}
      - GATEWAY_RATE_LIMIT_WINDOW=${GATEWAY_RATE_LIMIT_WINDOW:-10000}
      - GATEWAY_RATE_LIMIT_MAX_REQUESTS=${GATEWAY_RATE_LIMIT_MAX_REQUESTS:-20}
    networks:
      - internal
      - edge
    depends_on:
      - eureka-server
      - api-service
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true